name: Temporary D4 client NAR hash probe
on:
  pull_request:
    paths:
      - '.github/workflows/d4-client-narhash-probe.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Measure verified exact client source hash
        run: |
          set -euo pipefail
          revision=4aa49c5a8d6720b1a90ae651270c885a941697b8
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai.nvim/$revision" > "$RUNNER_TEMP/metadata.json"
          jq -e --arg revision "$revision" '.locked.rev == $revision and (.locked.narHash | startswith("sha256-"))' "$RUNNER_TEMP/metadata.json"
          jq -c '{locked: .locked}' "$RUNNER_TEMP/metadata.json"
