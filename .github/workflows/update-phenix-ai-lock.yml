name: Update phenix-ai lock

on:
  push:
    branches:
      - update/phenix-ai-agent-tool-fixes

permissions:
  contents: read

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Update phenix-ai lock input
        run: |
          set -euo pipefail
          nix flake lock --update-input phenix-ai
          python3 - <<'PY'
          import json
          with open("flake.lock", "r", encoding="utf-8") as f:
              lock = json.load(f)
          print("PHENIX_AI_LOCK=" + json.dumps(lock["nodes"]["phenix-ai"]["locked"], sort_keys=True))
          PY
