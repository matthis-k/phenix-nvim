name: One-shot wire startup test

on:
  push:
    branches:
      - refactor/wrapper-port-nvim-flake

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/wrapper-port-nvim-flake
          fetch-depth: 0

      - name: Wire failure-safe startup test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("modules/development.nix")
          lines = path.read_text().splitlines(keepends=True)
          section = next(i for i, line in enumerate(lines) if "startup = {" in line)
          start = next(i for i in range(section, len(lines)) if "nix run .#nvim-nix -- --headless" in lines[i])
          end = next(i for i in range(start, len(lines)) if "'+qa'" in lines[i])
          lines[start:end + 1] = [
              '                    nix run .#nvim-nix -- --headless "+lua dofile(\'${repo_root}/tests/startup.lua\')"\n'
          ]
          path.write_text("".join(lines))
          PY

          rm .github/workflows/one-shot-wire-startup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: wire failure-safe configured startup"
          git push origin HEAD:refactor/wrapper-port-nvim-flake
