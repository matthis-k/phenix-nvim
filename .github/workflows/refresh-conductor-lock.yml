name: Refresh conductor lock

on:
  push:
    branches:
      - agent/fix-conductor-wiring

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: agent/fix-conductor-wiring

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Regenerate dependency lock
        run: nix flake lock

      - name: Commit generated lock and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-conductor-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock .github/workflows/refresh-conductor-lock.yml
          git commit -m "chore: refresh conductor dependency lock"
          git push origin HEAD:agent/fix-conductor-wiring
