name: Update Phenix locks

on:
  push:
    branches:
      - propagate/phenix-ai-skill-fix

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: propagate/phenix-ai-skill-fix
      - uses: cachix/install-nix-action@v31
      - name: Update Phenix inputs
        run: nix flake lock --update-input phenix-ai --update-input phenix-ai-nvim
      - name: Commit lock
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update Phenix AI locks"
          git push
