name: Provider client lock verification
on:
  pull_request:
  push:
    branches:
      - feat/provider-onboarding-client-20261017
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Show actual merged client NAR hash
        shell: bash
        run: |
          set -euo pipefail
          nix flake lock --update-input phenix-ai-nvim
          jq -c '.nodes["phenix-ai-nvim"].locked' flake.lock
          rev=$(jq -r '.nodes["phenix-ai-nvim"].locked.rev' flake.lock)
          test "$rev" = "10ed457643eb735040cd0722eb455c5e0a0ae0c2"
