name: "Temporary routed authentication fix"

on:
  push:
    branches:
      - "feat/provider-auth-model-selection"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/provider-auth-model-selection

      - name: Update routed auth coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/startup.lua")
          source = path.read_text()
          replacements = {
              'assert(type(routing_choices) == "table" and #routing_choices == 3, "model/routing picker exposed the wrong number of choices")':
                  'assert(type(routing_choices) == "table" and #routing_choices == 4, "model/routing picker exposed the wrong number of choices")',
              'routing_seen[choice.profile] = true': 'routing_seen[choice.profile.id] = true',
              'choice.kind == "routing" and choice.profile == "router.mixed"':
                  'choice.kind == "routing" and choice.profile.id == "router.mixed"',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"startup routing assertion not found: {old}")
              source = source.replace(old, new, 1)
          marker = '''end, 20), "routing selection did not retarget the session")
vim.ui.select = original_ui_select
'''
          replacement = '''end, 20), "routing selection did not retarget the session")
local second_provider_ready = false
for _, descriptor in ipairs(phenix.state().catalogs[1].models or {}) do
  if descriptor.target and descriptor.target.provider == "fixture-two" then
    second_provider_ready = descriptor.selectable ~= false
  end
end
assert(second_provider_ready, "routing selection did not authenticate every required provider")
vim.ui.select = original_ui_select
'''
          if marker not in source:
              raise SystemExit("startup routing completion marker not found")
          path.write_text(source.replace(marker, replacement, 1))

          path = Path("lua/phenix/routing_selection.lua")
          source = path.read_text()
          old = '''    local arguments = { ... }
    discover_profiles(self, function(profiles, discovery_error)'''
          new = '''    local arguments = { n = select("#", ...), ... }
    discover_profiles(self, function(profiles, discovery_error)'''
          if old not in source:
              raise SystemExit("routing prompt argument capture not found")
          source = source.replace(old, new, 1)
          old = '''        direct_prompt(self, unpack(arguments))'''
          new = '''        direct_prompt(self, unpack(arguments, 1, arguments.n))'''
          if old not in source:
              raise SystemExit("routing prompt argument replay not found")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit routed auth coverage
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/startup.lua lua/phenix/routing_selection.lua
          git commit -m 'test: require every routed provider authentication'
          git push origin HEAD:feat/provider-auth-model-selection
