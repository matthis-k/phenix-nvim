name: Temporary Phenix AI stack lock sync

on:
  push:
    branches:
      - sync/phenix-ai-stack-current

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/phenix-ai-stack-current
      - uses: cachix/install-nix-action@v31
      - name: Update coordinated Phenix AI inputs
        run: nix flake update phenix-ai phenix-ai-nvim
      - name: Commit authoritative lock
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: refresh coordinated Phenix AI stack"
          git push origin HEAD:sync/phenix-ai-stack-current
