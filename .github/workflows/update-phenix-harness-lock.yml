name: Update Phenix harness lock

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update lock and remove updater
        run: |
          set -euo pipefail
          nix flake update phenix-agent-harness
          git rm .github/workflows/update-phenix-harness-lock.yml
          git add flake.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "deps: lock Phenix harness [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
