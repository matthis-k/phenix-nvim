name: Update Phenix stack locks

on:
  push:
    branches:
      - chore/propagate-phenix-stack-efb9580

permissions:
  contents: write

jobs:
  update-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Phenix inputs
        run: |
          set -euo pipefail
          nix flake lock --update-input phenix-ai --update-input phenix-ai-nvim
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update Phenix stack locks"
          git push
