# TEMPORARY pin evidence job; delete this workflow before merging the pin PR.
name: Temporary provider pin metadata
on:
  pull_request:
    paths:
      - '.github/workflows/provider-pin-evidence-temporary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derive-locked-revisions:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Resolve two accepted immutable GitHub flake revisions
        shell: bash
        run: |
          set -euo pipefail
          nix flake metadata --json 'github:matthis-k/phenix-ai/4ecf9b7b3b8e13ba117c10753881de58133748df' > "$RUNNER_TEMP/runtime.json"
          nix flake metadata --json 'github:matthis-k/phenix-ai.nvim/532d7340fffdda340929fdcc5336297e272a7fd0' > "$RUNNER_TEMP/client.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for name, file in [('phenix-ai','runtime.json'),('phenix-ai-nvim','client.json')]:
              data=json.loads((Path(os.environ["RUNNER_TEMP"])/file).read_text())
              locked=data.get('locked',{})
              expected={
                'phenix-ai':'4ecf9b7b3b8e13ba117c10753881de58133748df',
                'phenix-ai-nvim':'532d7340fffdda340929fdcc5336297e272a7fd0',
              }[name]
              assert locked.get('rev') == expected, (name, locked)
              assert locked.get('narHash','').startswith('sha256-'), (name, locked)
              assert isinstance(locked.get('lastModified'),int), (name, locked)
              print('PIN_EVIDENCE '+json.dumps(dict(name=name,locked=locked),sort_keys=True))
          PY
