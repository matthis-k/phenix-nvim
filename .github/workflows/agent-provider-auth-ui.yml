name: "Agent provider auth frontend"

on:
  push:
    branches:
      - "agent/provider-auth-ui"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Apply frontend auth patch
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          patch(
              "lua/phenix/conductor.lua",
              '''function Client:select_authentication(backend_id, method_id, callback)\n  return self:_request({\n    type = "select_authentication",\n    backend_id = nonempty(backend_id, "backend_id"),\n    method_id = nonempty(method_id, "method_id"),\n  }, callback)\nend''',
              '''function Client:select_authentication(backend_id, method_id, input, callback)\n  if type(input) == "function" and callback == nil then\n    callback = input\n    input = nil\n  end\n  assert(input == nil or type(input) == "table", "authentication input must be a table")\n  return self:_request({\n    type = "select_authentication",\n    backend_id = nonempty(backend_id, "backend_id"),\n    method_id = nonempty(method_id, "method_id"),\n    input = input and vim.deepcopy(input) or nil,\n  }, callback)\nend'''
          )

          patch(
              "lua/phenix/controller_actions.lua",
              '''  function Controller:authenticate(backend_id, method_id, callback)\n    callback = callback or noop\n    if not self:_begin_mutation(callback) then\n      return false\n    end\n    self.client:select_authentication(backend_id, method_id, function(result, err)\n      self.mutation_pending = false\n      if err then\n        callback(nil, err)\n        return\n      end\n      local catalog, catalog_error = install_catalog(self, result and result.catalog)\n      if catalog_error then\n        callback(nil, catalog_error)\n        return\n      end\n      self.on_state(self:state())\n      callback(catalog, nil)\n    end)\n    return true\n  end''',
              '''  function Controller:authenticate(backend_id, method_id, input, callback)\n    if type(input) == "function" and callback == nil then\n      callback = input\n      input = nil\n    end\n    callback = callback or noop\n    if input ~= nil and type(input) ~= "table" then\n      callback(nil, error_value("invalid_authentication_input", "authentication input must be a table"))\n      return false\n    end\n    if not self:_begin_mutation(callback) then\n      return false\n    end\n    self.client:select_authentication(backend_id, method_id, input, function(result, err)\n      self.mutation_pending = false\n      if err then\n        callback(nil, err)\n        return\n      end\n      local catalog, catalog_error = install_catalog(self, result and result.catalog)\n      if catalog_error then\n        callback(nil, catalog_error)\n        return\n      end\n      self.on_state(self:state())\n      callback(catalog, nil)\n    end)\n    return true\n  end'''
          )

          patch(
              "lua/phenix/session.lua",
              '''function Session:authenticate()\n  if not self:is_ready() then\n    vim.notify("Phenix: session is not ready", vim.log.levels.WARN)\n    return false\n  end\n  local choices = {}\n  for _, catalog in ipairs(self.controller:state().catalogs or {}) do\n    for _, method in ipairs(catalog.authentication_methods or {}) do\n      if method.selectable ~= false then\n        choices[#choices + 1] = {\n          backend = catalog.backend,\n          method = method,\n        }\n      end\n    end\n  end\n  if #choices == 0 then\n    vim.notify("Phenix: conductor exposes no selectable authentication methods", vim.log.levels.WARN)\n    return false\n  end\n  vim.ui.select(choices, {\n    prompt = "Authenticate",\n    format_item = function(choice)\n      return string.format("%s · %s", choice.backend, choice.method.name or choice.method.id)\n    end,\n  }, function(choice)\n    if not choice then\n      return\n    end\n    self.controller:authenticate(choice.backend, choice.method.id, function(_, error_value)\n      if error_value then\n        self.ui:append_error(format_error("authentication failed", error_value))\n      end\n    end)\n  end)\n  return true\nend''',
              '''function Session:authenticate()\n  if not self:is_ready() then\n    vim.notify("Phenix: session is not ready", vim.log.levels.WARN)\n    return false\n  end\n  local choices = {}\n  for _, catalog in ipairs(self.controller:state().catalogs or {}) do\n    for _, method in ipairs(catalog.authentication_methods or {}) do\n      if method.selectable ~= false then\n        choices[#choices + 1] = {\n          backend = catalog.backend,\n          method = method,\n        }\n      end\n    end\n  end\n  if #choices == 0 then\n    vim.notify("Phenix: conductor exposes no selectable authentication methods", vim.log.levels.WARN)\n    return false\n  end\n\n  local function authenticate_choice(choice, input)\n    self.controller:authenticate(choice.backend, choice.method.id, input, function(_, error_value)\n      if error_value then\n        self.ui:append_error(format_error("authentication failed", error_value))\n      end\n    end)\n  end\n\n  vim.ui.select(choices, {\n    prompt = "Authenticate",\n    format_item = function(choice)\n      return string.format("%s · %s", choice.backend, choice.method.name or choice.method.id)\n    end,\n  }, function(choice)\n    if not choice then\n      return\n    end\n    if choice.method.kind ~= "api_key" then\n      authenticate_choice(choice, nil)\n      return\n    end\n\n    vim.schedule(function()\n      local secret = vim.fn.inputsecret(string.format("%s: ", choice.method.name or choice.method.id))\n      vim.cmd("redraw")\n      if type(secret) ~= "string" or vim.trim(secret) == "" then\n        return\n      end\n      authenticate_choice(choice, {\n        type = "api_key",\n        secret = secret,\n      })\n    end)\n  end)\n  return true\nend'''
          )
          PY

      - name: Commit frontend implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lua/phenix/conductor.lua lua/phenix/controller_actions.lua lua/phenix/session.lua
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: support provider authentication inputs"
          git push
