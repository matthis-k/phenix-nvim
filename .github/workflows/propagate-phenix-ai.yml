name: Propagate Phenix AI

on:
  push:
    branches:
      - propagate/phenix-ai-9ab30c

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: propagate/phenix-ai-9ab30c
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Update Phenix AI lock
        run: |
          set -euo pipefail
          nix flake lock --override-input phenix-ai github:matthis-k/phenix-ai/9ab30c0001ebf0c52620b67ef473b5fb942ac5cc
          grep -q '9ab30c0001ebf0c52620b67ef473b5fb942ac5cc' flake.lock
          rm .github/workflows/propagate-phenix-ai.yml
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock .github/workflows/propagate-phenix-ai.yml
          git commit -m 'chore: propagate phenix-ai'
          git push origin HEAD:propagate/phenix-ai-9ab30c
