name: P1 Basic Neovim distribution

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'modules/package.nix'
      - 'modules/outputs.nix'
      - 'tests/distribution.lua'
      - 'tests/distribution_p1.lua'
      - 'tests/distribution_managed_providers.lua'
      - 'tests/distribution_live.py'
      - '.github/workflows/p1-basic-distribution.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'modules/package.nix'
      - 'modules/outputs.nix'
      - 'tests/distribution.lua'
      - 'tests/distribution_p1.lua'
      - 'tests/distribution_managed_providers.lua'
      - 'tests/distribution_live.py'
      - '.github/workflows/p1-basic-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new head on the same PR supersedes its prior expensive Nix build.
# Keep main and independent PR refs isolated.
concurrency:
  group: p1-basic-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Use the exact runtime/client pair in flake.lock for all product gates.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      # One writer, after the installed Basic journey passes on main.
      # Pull requests restore a compatible main cache without publishing one.
      - name: Restore and publish distribution Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: phenix-nvim-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            phenix-nvim-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            phenix-nvim-store-${{ runner.os }}-
          # Packaged Basic + Neovim reached 10.21 GB before GC while the
          # previous 4 GiB cap pruned it to 3.95 GB. Retain a larger
          # read-only-restorable hotset without changing any Nix derivations.
          gc-max-store-size-linux: "8G"
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Use shared Phenix cache
        if: ${{ vars.PHENIX_CACHIX_CACHE != '' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.PHENIX_CACHIX_CACHE }}
          skipPush: true
      - name: Verify managed nvim-nix default and isolated Basic compatibility preset
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$PWD"
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          export HOME="$state/home"
          export XDG_CACHE_HOME="$state/cache"
          export XDG_CONFIG_HOME="$state/config"
          export XDG_DATA_HOME="$state/data"
          export XDG_STATE_HOME="$state/state"
          # The installed Basic launcher owns storage initialization.
          # Running with no PHENIX_BASIC_SQLITE_PATH catches the prior bug:
          # session/new appeared to work while the first prompt failed.
          unset PHENIX_BASIC_SQLITE_PATH
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          # Prove the default uses the opt-in managed native host; do not
          # substitute the Basic-only alias or a fake provider transport.
          nix run --no-update-lock-file '.#nvim-nix' -- --headless \
            "+lua local ok, err = pcall(function() dofile('$repo_root/tests/distribution.lua'); dofile('$repo_root/tests/distribution_managed_providers.lua') end); if not ok then io.stderr:write(tostring(err)); vim.cmd('cquit 1') end" \
            '+qa!'
          # The unmodified Basic alias must retain its full prior accepted
          # prompt/replay/model selection and explicit unavailable-auth UX.
          nix run --no-update-lock-file '.#nvim-nix-basic' -- --headless \
            "+lua local ok, err = pcall(dofile, '$repo_root/tests/distribution_p1.lua'); if not ok then io.stderr:write(tostring(err)); vim.cmd('cquit 1') end" \
            '+qa!'
          test -s "$XDG_STATE_HOME/phenix/basic.sqlite"
          test "$(stat -c '%a' "$XDG_STATE_HOME/phenix/basic.sqlite")" = 600
      - name: Run live-P1 Neovim against local streaming HTTP provider
        shell: bash
        run: |
          set -euo pipefail
          # Exercise the same lockfile used by the regular distribution,
          # not the older isolated candidate above.
          live="$(nix build --no-update-lock-file --no-link --print-out-paths \
            '.#phenix-p1-live-prompt')"
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          python3 tests/distribution_live.py "$live/bin/phenix-p1-live-prompt" "$state"
          test -s "$state/result.json"
