name: Temporary N4 selected-revision client source probe
on:
  pull_request:
    paths:
      - '.github/workflows/n4-temporary-client-hash.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - run: |
          set -euo pipefail
          rev=41b496d8f55ac3cf1707d4ffa2326efdbcea1010
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai.nvim/$rev" > "$RUNNER_TEMP/metadata.json"
          jq -e --arg rev "$rev" '.locked.rev == $rev and (.locked.narHash | startswith("sha256-"))' "$RUNNER_TEMP/metadata.json"
          jq -c '{locked: .locked}' "$RUNNER_TEMP/metadata.json"
