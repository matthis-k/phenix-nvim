name: Format runtime preset

on:
  push:
    branches:
      - feat/provider-auth-model-selection
    paths:
      - .github/workflows/format-runtime.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/provider-auth-model-selection

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply nixfmt
        run: |
          set -euo pipefail
          nix run nixpkgs#nixfmt -- config/phenix/runtime.nix
          git diff --check

      - name: Commit formatting
        run: |
          set -euo pipefail
          rm .github/workflows/format-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: format runtime preset'
          git push origin HEAD:feat/provider-auth-model-selection
