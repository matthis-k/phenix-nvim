name: Sync Phenix AI stack lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'sync/phenix-ai-stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Phenix AI inputs
        run: nix flake update phenix-ai phenix-ai-nvim
      - name: Commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock
          git commit -m "deps: sync Phenix AI stack [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
