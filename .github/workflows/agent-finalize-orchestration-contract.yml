name: Agent finalize orchestration contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: cachix/install-nix-action@v31
      - name: Format contract and refresh harness pin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('config/phenix/runtime.nix')
          content = path.read_text()
          old = '''  target = provider: model: effort: {
              backend = "phenix";
              inherit provider model;
              inference = { inherit effort; };
            };
          '''
          new = '''  target = provider: model: effort: {
            backend = "phenix";
            inherit provider model;
            inference = { inherit effort; };
          };
          '''
          if content.count(old) != 1:
              raise SystemExit(f'expected one unformatted target block, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1))
          PY
          nix run .#phenix-maintenance -- check nix-format
          nix flake lock --override-input phenix-acp github:matthis-k/phenix-agent-harness/e2cd318c43d1c1f89e1b196b405e92af23d74171
          git diff --check
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/phenix/runtime.nix flake.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: finalize orchestration runtime contract'
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
