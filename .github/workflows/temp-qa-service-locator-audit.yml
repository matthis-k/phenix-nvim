name: Temporary QA service locator audit

on:
  push:
    branches:
      - feat/provider-auth-model-selection
    paths:
      - .github/workflows/temp-qa-service-locator-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Find dynamic frontend registry consumers
        run: |
          set -euo pipefail
          echo '=== phenix.frontend imports ==='
          rg -n 'require\(["'"']phenix\.frontend["'"']\)' . || true
          echo '=== registry/config/state calls ==='
          rg -n 'Frontend\.(config|state|register_api|require_api|define_api)|Phenix\.(api|config|state)|register_api\(|require_api\(|define_api\(' . || true
