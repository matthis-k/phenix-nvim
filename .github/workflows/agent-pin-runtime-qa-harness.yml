name: Agent pin runtime QA harness

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: cachix/install-nix-action@v31
      - name: Refresh harness lock
        run: |
          set -euo pipefail
          nix flake lock --override-input phenix-acp github:matthis-k/phenix-agent-harness/28071c0d07f614cc31334e89120526f7db42dc13
          git diff --check
      - name: Commit lock update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock
          git diff --cached --stat
          git commit -m 'chore: pin runtime QA harness'
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
