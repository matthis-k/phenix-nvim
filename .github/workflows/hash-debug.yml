name: Hash debug

on:
  pull_request:
    paths:
      - "modules/package.nix"
      - ".github/workflows/hash-debug.yml"

permissions:
  contents: read

jobs:
  hash-debug:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Resolve fixed-output hash
        shell: bash
        run: |
          set +e
          nix run .#phenix-maintenance -- test startup 2>&1 | tee /tmp/nix-build.log
          status=${PIPESTATUS[0]}
          got="$(sed -nE 's/^[[:space:]]*got:[[:space:]]+([^[:space:]]+).*/\1/p' /tmp/nix-build.log | tail -n1)"
          if [[ -n "$got" ]]; then
            echo "::error title=Nix fixed-output hash::$got"
          fi
          exit "$status"
