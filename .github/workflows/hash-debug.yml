name: Product debug

on:
  pull_request:
    paths:
      - "modules/package.nix"
      - ".github/workflows/hash-debug.yml"

permissions:
  contents: read

jobs:
  product-debug:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Diagnose Neovim plugin smoke
        shell: bash
        run: |
          set +e
          nix run .#phenix-maintenance -- test plugin 2>&1 | tee /tmp/product-smoke.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Neovim plugin smoke::$line"
            done < <(tail -n 40 /tmp/product-smoke.log)
          fi
          exit "$status"
