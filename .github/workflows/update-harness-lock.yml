name: update-harness-lock

on:
  push:
    branches:
      - cleanup/use-configured-harness

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: cleanup/use-configured-harness

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Update Harness lock and remove helper
        run: |
          set -euo pipefail
          nix flake lock --update-input phenix-harness
          git rm .github/workflows/update-harness-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update phenix-harness lock"
          git push origin HEAD:cleanup/use-configured-harness
