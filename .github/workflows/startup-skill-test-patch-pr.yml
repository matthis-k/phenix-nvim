name: startup-skill-test-patch-pr

on:
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/skills-unslop' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/skills-unslop
          fetch-depth: 0
      - run: python3 .github/startup-skill-test-patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/startup.lua
          git commit -m 'test: verify packaged unslop discovery'
          git push origin HEAD:agent/skills-unslop
