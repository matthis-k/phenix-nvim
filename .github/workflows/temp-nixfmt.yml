name: "Temporary nixfmt"

on:
  push:
    branches:
      - "feat/provider-auth-model-selection"
    paths:
      - ".github/workflows/temp-nixfmt.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/provider-auth-model-selection

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Format changed Nix files
        run: |
          set -euo pipefail
          nix run nixpkgs#nixfmt -- modules/package.nix config/phenix/runtime.nix
          git diff -- modules/package.nix config/phenix/runtime.nix

      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/package.nix config/phenix/runtime.nix
          git commit -m 'chore: apply Nix formatting'
          git push origin HEAD:feat/provider-auth-model-selection
