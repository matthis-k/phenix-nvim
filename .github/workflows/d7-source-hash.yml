name: D7 merged source metadata (temporary)
on:
  pull_request:
    paths: ['.github/workflows/d7-source-hash.yml']
permissions: {contents: read}
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Measure exact accepted runtime/client source hashes
        run: |
          set -euo pipefail
          runtime=e63ed747e0b7b3c60de66b041d39c017c015fb8a
          client=912f7952325bcc88109026449e33b1a560ccf376
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai/$runtime" > "$RUNNER_TEMP/runtime.json"
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai.nvim/$client" > "$RUNNER_TEMP/client.json"
          jq -e --arg rev "$runtime" '.locked.rev == $rev and (.locked.narHash | startswith("sha256-"))' "$RUNNER_TEMP/runtime.json"
          jq -e --arg rev "$client" '.locked.rev == $rev and (.locked.narHash | startswith("sha256-"))' "$RUNNER_TEMP/client.json"
          jq -c '{runtime:.locked}' "$RUNNER_TEMP/runtime.json"
          jq -c '{client:.locked}' "$RUNNER_TEMP/client.json"
