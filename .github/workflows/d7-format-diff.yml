name: D7 canonical format diff (temporary)
on:
  pull_request:
    paths: ['.github/workflows/d7-format-diff.yml']
permissions: {contents: read}
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      - name: Canonical source formatter diff
        run: |
          set -euo pipefail
          nix run --no-update-lock-file .#phenix-source-maintenance -- fix
          git --no-pager diff -- modules/package.nix
