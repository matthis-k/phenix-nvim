name: Temporary D6 verified auth client source metadata
on:
  pull_request:
    paths:
      - '.github/workflows/d6-temporary-client-hash.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: |
          set -euo pipefail
          rev=9d1fc9d1d513258651a3eff7d0047088214dfe28
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai.nvim/$rev" > "$RUNNER_TEMP/metadata.json"
          jq -e --arg rev "$rev" '.locked.rev == $rev and (.locked.narHash | startswith("sha256-"))' "$RUNNER_TEMP/metadata.json"
          jq -c '{locked:.locked}' "$RUNNER_TEMP/metadata.json"
