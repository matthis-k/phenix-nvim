name: Repin final harness

on:
  push:
    branches:
      - feat/provider-auth-model-selection
    paths:
      - .github/workflows/repin-final-harness.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/provider-auth-model-selection

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Repin companion harness
        run: |
          set -euo pipefail
          nix flake lock --override-input phenix-acp github:matthis-k/phenix-agent-harness/7121a6d1f8df34e6c68413d85b4590462c0df9ff
          git diff --check
          git diff -- flake.lock

      - name: Commit lock update
        run: |
          set -euo pipefail
          rm .github/workflows/repin-final-harness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: pin canonical harness auth boundary'
          git push origin HEAD:feat/provider-auth-model-selection
