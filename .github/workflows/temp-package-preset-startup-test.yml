name: "Temporary packaged preset startup test"

on:
  push:
    branches:
      - "feat/provider-auth-model-selection"
    paths:
      - ".github/workflows/temp-package-preset-startup-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/provider-auth-model-selection

      - name: Assert packaged routing and workflow preset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/startup.lua")
          source = path.read_text()
          marker = '''assert(type(default_catalog.models) == "table" and #default_catalog.models > 0, "Phenix backend exposed no default model target")

local auth_methods = {}
'''
          replacement = '''assert(type(default_catalog.models) == "table" and #default_catalog.models > 0, "Phenix backend exposed no default model target")
assert(default_state.session.default_target.kind == "routed", "packaged default session is not routed")
assert(default_state.session.default_target.value == "router.mixed", "packaged default session does not use router.mixed")

local default_routes = nil
default_session.controller.client:get_routing_catalog(function(result, err)
  assert(err == nil, "packaged routing catalog failed: " .. vim.inspect(err))
  default_routes = result and result.profiles
end)
assert(vim.wait(5000, function() return default_routes ~= nil end, 20), "packaged routing catalog did not arrive")
local expected_routes = {
  ["router.mixed"] = true,
  ["router.openai-api"] = true,
  ["router.opencode-go"] = true,
  ["router.chatgpt-plus"] = true,
  ["router.free"] = true,
}
assert(#default_routes == 5, "packaged routing catalog has the wrong size: " .. vim.inspect(default_routes))
for _, route in ipairs(default_routes) do
  assert(expected_routes[route], "packaged routing catalog exposed unexpected route: " .. tostring(route))
  expected_routes[route] = nil
end
assert(next(expected_routes) == nil, "packaged routing catalog omitted routes: " .. vim.inspect(expected_routes))

local default_callables = nil
assert(phenix.refresh_callables(function(callables, err)
  assert(err == nil, "packaged callable catalog failed: " .. vim.inspect(err))
  default_callables = callables
end), "packaged callable catalog refresh was rejected")
assert(vim.wait(5000, function() return default_callables ~= nil end, 20), "packaged callable catalog did not arrive")
local expected_workflows = {
  ["workflow.implement"] = true,
  ["workflow.qa"] = true,
  ["workflow.qa-fix"] = true,
  ["workflow.design"] = true,
  ["workflow.migrate"] = true,
  ["workflow.refactor"] = true,
  ["workflow.security"] = true,
  ["workflow.ui-change"] = true,
  ["workflow.debug"] = true,
  ["workflow.review"] = true,
  ["workflow.research"] = true,
  ["workflow.grill"] = true,
  ["workflow.spec"] = true,
  ["workflow.tickets"] = true,
  ["workflow.tdd"] = true,
  ["workflow.architecture"] = true,
  ["workflow.domain-model"] = true,
  ["workflow.wayfinder"] = true,
}
local workflow_count = 0
local agent_count = 0
for _, callable in ipairs(default_callables) do
  if callable.kind == "workflow" then
    workflow_count = workflow_count + 1
    assert(expected_workflows[callable.id], "packaged callable catalog exposed unexpected workflow: " .. callable.id)
    expected_workflows[callable.id] = nil
  elseif callable.kind == "agent" then
    agent_count = agent_count + 1
  end
end
assert(workflow_count == 18, "packaged callable catalog has the wrong workflow count: " .. workflow_count)
assert(agent_count == 10, "packaged callable catalog has the wrong agent count: " .. agent_count)
assert(next(expected_workflows) == nil, "packaged callable catalog omitted workflows: " .. vim.inspect(expected_workflows))

local auth_methods = {}
'''
          if marker not in source:
              raise SystemExit("startup preset insertion marker not found")
          path.write_text(source.replace(marker, replacement, 1))
          PY
          git diff --check
          git diff -- tests/startup.lua

      - name: Commit startup coverage
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/startup.lua
          git commit -m 'test: assert packaged routing and workflow preset'
          git push origin HEAD:feat/provider-auth-model-selection
