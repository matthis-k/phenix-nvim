name: Temporary D4 C9 runtime source probe
on:
  pull_request:
    paths:
      - '.github/workflows/d4-c9-runtime-probe.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Verify runtime source at accepted C9c main commit
        run: |
          set -euo pipefail
          revision=071582491d66b41a52c6629a38b69a98e6db0e3c
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai/$revision" > "$RUNNER_TEMP/runtime.json"
          jq -e --arg revision "$revision" '.locked.rev == $revision and (.locked.narHash | startswith("sha256-"))' "$RUNNER_TEMP/runtime.json"
          jq -c '{locked: .locked}' "$RUNNER_TEMP/runtime.json"
