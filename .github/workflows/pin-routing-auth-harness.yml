name: "Pin routed auth harness"

on:
  push:
    branches:
      - "feat/provider-auth-model-selection"
    paths:
      - ".github/workflows/pin-routing-auth-harness.yml"

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/provider-auth-model-selection

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Pin validated routing-provider protocol
        run: |
          set -euo pipefail
          nix flake lock --override-input phenix-acp github:matthis-k/phenix-agent-harness/c16caa4cdd5ce4ab8557961e1d91b41dbbd31b65
          git diff -- flake.lock

      - name: Commit pin
        run: |
          set -euo pipefail
          rm .github/workflows/pin-routing-auth-harness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: pin routed auth conductor protocol'
          git push origin HEAD:feat/provider-auth-model-selection
