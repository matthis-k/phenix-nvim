name: Orchestration source migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orchestration-source-schema
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Author canonical orchestration definitions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('config/phenix/runtime.nix')
          text = path.read_text()
          replacements = [
              ('WorkflowDefinition', 'OrchestrationDefinition'),
              ('sequential workflows', 'sequential orchestrations'),
              ('step = agent: task:', 'node = agent: task:'),
              ('current workflow objective.', 'current orchestration objective.'),
              ('workflow = id: title: steps:', 'orchestration = id: title: nodes:'),
              ('inherit steps;', 'inherit nodes;'),
              ('qaReviewSteps', 'qaReviewNodes'),
              ('(step "', '(node "'),
              ('workflows = [', 'orchestrations = ['),
              ('(workflow "', '(orchestration "'),
              ('inherit workflows;', 'inherit orchestrations;'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Pin matching harness definition contract
        run: |
          nix flake lock --override-input phenix-acp github:matthis-k/phenix-agent-harness/2f1a49e84868d2639fec3707d8f88998e56f1ff1
      - name: Normalize and validate
        run: |
          nix run .#phenix-maintenance -- fix
          nix run .#phenix-maintenance -- check
          nix run .#phenix-maintenance -- test startup
      - name: Commit migrated source
        run: |
          rm .github/workflows/orchestration-source-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: author orchestration definitions directly'
          git push origin HEAD:agent/orchestration-source-schema
