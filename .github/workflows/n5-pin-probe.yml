name: Temporary accepted N5 client NAR probe
on:
  pull_request:
    paths:
      - .github/workflows/n5-pin-probe.yml

permissions:
  contents: read

jobs:
  pin:
    if: github.head_ref == 'chore/pin-accepted-n5-client-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Compute Nix source NAR and upload updated lock
        run: |
          nix flake lock --override-input phenix-ai-nvim github:matthis-k/phenix-ai.nvim/a0638b2624d40692530839952bb5e950cbeeeb76
          python3 - <<'PY'
          import json
          n = json.load(open("flake.lock"))["nodes"]["phenix-ai-nvim"]["locked"]
          assert n["rev"] == "a0638b2624d40692530839952bb5e950cbeeeb76", n
          assert n["narHash"].startswith("sha256-"), n
          print("Verified client source:", n)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n5-client-probed-lock
          path: flake.lock
          retention-days: 7
