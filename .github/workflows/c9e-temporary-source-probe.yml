name: Temporary C9e Nix source hash probe
on:
  pull_request:
    paths:
      - '.github/workflows/c9e-temporary-source-probe.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - run: |
          set -euo pipefail
          rev=bf2336d3b7dc74315c51e2c78c1c61496d27454a
          nix flake metadata --json --refresh "github:matthis-k/phenix-ai/$rev" > "$RUNNER_TEMP/metadata.json"
          jq -e --arg rev "$rev" '.locked.rev == $rev and (.locked.narHash | startswith("sha256-"))' "$RUNNER_TEMP/metadata.json"
          jq -c '{locked: .locked}' "$RUNNER_TEMP/metadata.json"
