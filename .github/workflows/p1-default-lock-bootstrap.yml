# Temporary exact-input lock materialization. Remove after pinning.
name: P1 distribution lock bootstrap
on:
  pull_request:
    paths: [.github/workflows/p1-default-lock-bootstrap.yml, flake.nix]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Resolve runtime and client P1 candidates
        shell: bash
        run: |
          set -euo pipefail
          nix flake lock \
            --override-input phenix-ai github:matthis-k/phenix-ai/8ad88aec18c34034beb53afc385af370771488b3 \
            --override-input phenix-ai-nvim github:matthis-k/phenix-ai.nvim/e05a05a0b8cd5a493ddf5ac7175bfc614dc86185
          python3 - <<'PY'
          import base64
          from pathlib import Path
          print("PHENIX_DIST_LOCK_BEGIN")
          print(base64.b64encode(Path("flake.lock").read_bytes()).decode("ascii"))
          print("PHENIX_DIST_LOCK_END")
          PY
