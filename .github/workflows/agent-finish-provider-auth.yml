name: "Agent finish provider auth integration"

on:
  push:
    branches:
      - "agent/provider-auth-ui"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Pin merged provider auth backend
        run: nix flake update phenix-acp

      - name: Assert packaged authentication catalog
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("tests/startup.lua")
          text = path.read_text()
          old = '''assert(type(default_catalog.models) == "table" and #default_catalog.models > 0, "Phenix backend exposed no default model target")\nphenix.shutdown()'''
          new = '''assert(type(default_catalog.models) == "table" and #default_catalog.models > 0, "Phenix backend exposed no default model target")\n\nlocal auth_methods = {}\nfor _, method in ipairs(default_catalog.authentication_methods or {}) do\n  auth_methods[method.id] = method\nend\nlocal codex_auth = assert(auth_methods["openai-codex"], "Phenix backend did not expose ChatGPT/Codex OAuth")\nassert(codex_auth.kind == "agent", "ChatGPT/Codex auth has the wrong kind")\nassert(codex_auth.selectable ~= false, "ChatGPT/Codex auth is not selectable")\nfor _, provider in ipairs({ "openai-api", "opencode-zen", "opencode-go", "open-router" }) do\n  local method = assert(auth_methods[provider], "Phenix backend did not expose auth for " .. provider)\n  assert(method.kind == "api_key", provider .. " auth is not an API-key adapter")\n  assert(method.selectable ~= false, provider .. " auth is not selectable")\nend\n\nphenix.shutdown()'''
          if text.count(old) != 1:
              raise SystemExit("startup catalog assertion anchor changed")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock tests/startup.lua
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: integrate provider authentication catalog"
          git push
