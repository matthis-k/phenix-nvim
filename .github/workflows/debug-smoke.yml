name: Debug smoke

on:
  push:
    branches:
      - refactor/plugin-config-boundary

permissions:
  contents: read

jobs:
  smoke:
    name: Diagnostic smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Build wrapped editor
        shell: bash
        run: nix build .#nvim-nix --print-build-logs -L -o result

      - name: Run smoke directly
        shell: bash
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          log="$(mktemp)"
          trap 'rm -rf "$tmp"; rm -f "$log"' EXIT

          export PHENIX_TEST_FIXTURE="$PWD/tests/fixture_agent.py"
          export PHENIX_TEST_PYTHON="$(command -v python3)"
          export PHENIX_TEST_CONFIG="$(nix eval --impure --raw --expr '((builtins.getFlake (toString ./.)).inputs.phenix-acp.outPath + "/config/phenix-harness/init.lua")')"

          set +e
          HOME="$tmp/home" \
          XDG_CACHE_HOME="$tmp/cache" \
          XDG_CONFIG_HOME="$tmp/config" \
          XDG_DATA_HOME="$tmp/data" \
          XDG_STATE_HOME="$tmp/state" \
            ./result/bin/nvim-nix --headless \
              "+lua dofile('$PWD/tests/smoke.lua')" \
              '+qa!' 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          if (( status != 0 )); then
            python3 - "$log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-12000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Neovim runtime smoke::{text}")
          PY
            exit "$status"
          fi
