name: Debug smoke

on:
  push:
    branches:
      - refactor/plugin-config-boundary

permissions:
  contents: read

jobs:
  smoke:
    name: Diagnostic ACP package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Build ACP plugin
        run: nix build .#phenix-acp-plugin --print-build-logs -L
