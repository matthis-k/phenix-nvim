name: Propagate Phenix AI locks

on:
  push:
    branches:
      - propagate-phenix-ai-839e546

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: cachix/install-nix-action@v31
      - name: Update locks
        run: |
          set -euo pipefail
          nix flake lock --update-input phenix-ai --update-input phenix-ai-nvim
          rm .github/workflows/propagate-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock .github/workflows/propagate-lock.yml
          git commit -m "chore: propagate Phenix AI"
          git push origin HEAD:${{ github.ref_name }}
