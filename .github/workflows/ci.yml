name: Sync canonical Phenix Neovim mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phenix-nvim-mirror
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Materialize canonical export
        env:
          CONDUCTOR_REV: afc5ca74f1f09419066c4d8bd51af28a6894c7d2
        run: |
          set -euo pipefail
          export_path="$(nix build --no-link --print-out-paths "github:matthis-k/phenix-conductor/$CONDUCTOR_REV#phenix-nvim-export")"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          cp -a "$export_path"/. .
          chmod -R u+w .
          test "$(cat .phenix-conductor-revision)" = "$CONDUCTOR_REV"
          git diff --check
      - name: Commit mirror payload
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain=v1 --untracked-files=all)"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: materialize canonical Neovim export'
          git push origin HEAD:main
