name: Sync lock graph

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize lock and drop diagnostic
        run: |
          set -euo pipefail
          nix flake update phenix-pins phenix-flake-ci
          rm -f eval-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A flake.lock eval-error.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'deps: normalize canonical flake CI edge [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
