name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    # Source checks run on every PR, including drafts.
    name: Source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: Verify dependency isolation and Nix cache policy
        run: |
          python3 -m unittest discover -s tests -p 'test_no_phenix_ai.py'
          python3 -m unittest discover -s tests -p 'test_ci_cache_policy.py'
      - run: nix run --no-update-lock-file .#phenix-source-maintenance -- check

  product:
    name: Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs:
      - source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: Restore and publish shared Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: phenix-nvim-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            phenix-nvim-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            phenix-nvim-store-${{ runner.os }}-
          gc-max-store-size-linux: "8G"
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Use shared Phenix cache
        if: ${{ vars.PHENIX_CACHIX_CACHE != '' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.PHENIX_CACHIX_CACHE }}
          skipPush: true
      - run: nix run --no-update-lock-file .#phenix-test-maintenance -- test

  checks:
    if: always()
    name: Maintenance checks
    needs:
      - source
      - product
    runs-on: ubuntu-latest
    steps:
      - name: Verify all maintenance jobs passed
        run: |
          set -euo pipefail
          [[ '${{ needs.source.result }}' == success ]]
          [[ '${{ needs.product.result }}' == success ]]

