# Temporary PR-local maintenance autofix. The autofix job restores this file from main before committing.
name: "CI"

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/provider-auth-model-selection'
    name: "Maintenance autofix"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/provider-auth-model-selection
          fetch-depth: 1

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply deterministic maintenance fixes
        run: |
          set -euo pipefail
          nix run .#phenix-maintenance -- fix
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check

      - name: Commit autofixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: apply maintenance fixes'
          git push origin HEAD:feat/provider-auth-model-selection

  source:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Source"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Nix formatting"
        run: nix run .#phenix-maintenance -- check nix-format

      - name: "Statix"
        run: nix run .#phenix-maintenance -- check statix

      - name: "Deadnix"
        run: nix run .#phenix-maintenance -- check deadnix

      - name: "Actionlint"
        run: nix run .#phenix-maintenance -- check actionlint

      - name: "Generated workflow"
        run: nix run .#phenix-maintenance -- check workflow-sync

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  product:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Product"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    needs:
      - source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Neovim plugin smoke"
        run: nix run .#phenix-maintenance -- test plugin

      - name: "Persistent conductor socket transport"
        run: nix run .#phenix-maintenance -- test socket

      - name: "Native conductor startup"
        run: nix run .#phenix-maintenance -- test startup

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  checks:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: "Maintenance checks"
    needs:
      - source
      - product
    runs-on: ubuntu-latest
    steps:
      - name: Verify all maintenance jobs passed
        run: |
          set -euo pipefail
          [[ '${{ needs.source.result }}' == success ]]
          [[ '${{ needs.product.result }}' == success ]]
