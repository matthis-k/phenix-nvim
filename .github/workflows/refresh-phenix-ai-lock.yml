name: Refresh Phenix AI lock

on:
  push:
    branches:
      - fix/codex-wire-version
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref_name }}
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      - name: Refresh Phenix AI input
        run: nix flake lock --update-input phenix-ai
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: refresh Phenix AI lock"
          git push origin HEAD:${GITHUB_REF_NAME}
