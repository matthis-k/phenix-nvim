name: Agent orchestration contract update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: cachix/install-nix-action@v31
      - name: Apply frontend contract and pin harness
        run: |
          python3 -m py_compile .github/agent-orchestration-contract.py
          python3 .github/agent-orchestration-contract.py
          nix fmt -- config/phenix/runtime.nix
          nix flake lock --override-input phenix-acp github:matthis-k/phenix-agent-harness/f86a2c112ccd4ac301ba0cb256f031cada77dd06
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/phenix/runtime.nix flake.lock
          git diff --cached --stat
          git commit -m 'fix: adopt canonical orchestration runtime contract'
          git push
