name: Update conductor contract

on:
  push:
    branches:
      - agent/use-conductor-default-backend

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-conductor-default-backend

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Remove frontend-owned backend composition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          package = Path('modules/package.nix')
          text = package.read_text()
          start = text.index('      phenixPi = pkgs.buildNpmPackage')
          end = text.index('      neovim = inputs.neovim-nightly.packages.${system}.default;', start)
          text = text[:start] + text[end:]
          text = text.replace(
              '          # The frontend must use the fully composed conductor product rather\n'
              '          # than launching the backend-neutral conductor with an empty catalog.\n'
              '          PHENIX_CONDUCTOR_COMMAND = "${phenixFrontendConductor}/bin/phenix-conductor-nvim";',
              '          # The conductor owns its default Phenix backend and works without\n'
              '          # frontend-supplied backend bootstrap flags.\n'
              '          PHENIX_CONDUCTOR_COMMAND = "${phenixConductor}/bin/phenix-conductor";',
          )
          for line in (
              '          phenixBackendBootstrapCheck\n',
              '          phenixFrontendConductor\n',
              '          phenixPi\n',
              '          phenixPiAcp\n',
          ):
              text = text.replace(line, '')
          package.write_text(text)

          development = Path('modules/development.nix')
          text = development.read_text()
          text = text.replace(
              '    { pkgs, ... }:\n    let\n      maintenanceLib = inputs.phenix-flake-ci.lib;',
              '    { pkgs, system, ... }:\n    let\n      maintenanceLib = inputs.phenix-flake-ci.lib;\n      phenixConductor = inputs.phenix-acp.packages.${system}.phenix-conductor;',
          )
          needle = '''                  export PHENIX_TEST_PYTHON="${pkgs.python3}/bin/python3"\n                  HOME="$tmp/home" \\\n'''
          replacement = '''                  export PHENIX_TEST_PYTHON="${pkgs.python3}/bin/python3"\n                  export PHENIX_CREDENTIAL_FILE="$tmp/credentials.json"\n                  export PHENIX_MODEL="openai-codex/nvim-startup-smoke"\n                  printf '%s\\n' '{"id":1,"command":{"type":"initialize","after_sequence":null}}' |\n                    "${phenixConductor}/bin/phenix-conductor" > "$tmp/conductor.jsonl"\n                  ${pkgs.jq}/bin/jq -e '\n                    .type == "response"\n                    and .id == 1\n                    and .status == "ok"\n                    and .result.type == "initialized"\n                    and ([\n                      .result.backends[]\n                      | select(.backend == "phenix")\n                      | .models[]\n                      | select(\n                          .target.backend == "phenix"\n                          and .target.provider == "openai-codex"\n                          and .target.model == "nvim-startup-smoke"\n                        )\n                    ] | length == 1)\n                  ' "$tmp/conductor.jsonl" >/dev/null\n                  HOME="$tmp/home" \\\n'''
          if needle not in text:
              raise SystemExit('startup insertion point not found')
          text = text.replace(needle, replacement, 1)
          development.write_text(text)

          startup = Path('tests/startup.lua')
          text = startup.read_text()
          needle = 'assert(vim.g.loaded_phenix_acp == nil, "legacy ACP plugin marker is still active")\n'
          replacement = needle + '''local packaged_conductor = assert(vim.env.PHENIX_CONDUCTOR_COMMAND, "packaged conductor command is unavailable")\nassert(packaged_conductor:match("/bin/phenix%-conductor$"), "packaged frontend does not launch bare phenix-conductor: " .. packaged_conductor)\nassert(not packaged_conductor:find("phenix%-conductor%-nvim"), "legacy frontend-composed conductor survived packaging")\nassert(not packaged_conductor:find("pi%-acp"), "Pi ACP backend leaked into the default frontend path")\n'''
          if needle not in text:
              raise SystemExit('startup assertion insertion point not found')
          startup.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Pin merged conductor
        run: nix flake lock --update-input phenix-acp

      - name: Format Nix changes
        run: nix shell nixpkgs#nixfmt -c nixfmt modules/package.nix modules/development.nix

      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/package.nix modules/development.nix tests/startup.lua flake.lock
          git commit -m 'use conductor-owned default backend'
          git push
