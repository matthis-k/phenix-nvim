name: Refresh Phenix AI.nvim lock

on:
  push:
    branches:
      - chore/propagate-readiness-fix

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: chore/propagate-readiness-fix
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Advance canonical Neovim client
        run: |
          set -euo pipefail
          nix flake update phenix-ai-nvim
          git diff -- flake.lock
      - name: Commit refreshed lock
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: advance Phenix AI.nvim readiness fix"
          git push origin HEAD:chore/propagate-readiness-fix

# retrigger after workflow registration
