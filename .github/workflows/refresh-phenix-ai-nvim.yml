name: Refresh Phenix AI.nvim lock

on:
  push:
    branches:
      - chore/refresh-phenix-ai-nvim
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chore/refresh-phenix-ai-nvim' || github.ref_name == 'chore/refresh-phenix-ai-nvim'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: chore/refresh-phenix-ai-nvim
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Refresh dependency lock
        run: nix flake lock --update-input phenix-ai-nvim
      - name: Commit lock if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: refresh Phenix AI.nvim lock"
          git push origin HEAD:chore/refresh-phenix-ai-nvim
